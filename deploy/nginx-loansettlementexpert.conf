# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name loansettlementexpert.in www.loansettlementexpert.in;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loansettlementexpert.in www.loansettlementexpert.in;

    ssl_certificate /etc/letsencrypt/live/loansettlementexpert.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loansettlementexpert.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Performance & Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    client_max_body_size 25M;

    # High-Performance Compression for all clients & crawlers
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_http_version 1.0;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/x-icon;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    location /_next/static {
        proxy_pass http://127.0.0.1:3005;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }
}
